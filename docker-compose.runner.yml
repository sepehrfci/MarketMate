services:
  runner:
    image: gitlab/gitlab-runner:alpine
    container_name: marketmate-gitlab-runner
    restart: unless-stopped
    network_mode: host
    userns_mode: host
    volumes:
      - runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  runner-config:
    name: marketmate-gitlab-runner-config
